<head>

</head>

<body>

    <div class="alert alert-primary" role="alert">
        <strong>cAVEAT</strong>
        This is a student's project and not an attempt to clone the existing webpage !
    </div>
    <nav class="navbar navbar-expand-lg bg-body-primary" style="background: red;">


        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" style="background: rgb(58, 61, 58);">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link joshua" href="spotify.html">Spotify</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link joshua" href="producthunt.html">Product Hunt</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link joshua" href="scribd.html">Scribd</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="wholeweb">
        <header>
            <h1 class="headerlogo">upwork</h1>
        </header>

        <main class="login-container">
            <form class="login-card">
                <h2>Log in to Upwork</h2>

                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input class="user" type="text" placeholder="Username or Email">
                </div>

                <button type="submit" class="continue-btn">Continue</button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="googlebtn">
                    <div class="google-icon-wrapper">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <span>Continue with Google</span>
                </button>
                <div class="signupspace">
                    <button type="button" class="applebtn">
                        <i class="fa-brands fa-apple"></i> Continue with Apple
                    </button>
                </div>

                <div class="signup-section">
                    <p>Don't have an Upwork account?</p>
                    <div class="signpadding">
                        <button type="button" class="signup-btn">Sign Up</button>
                    </div>
                </div>
            </form>
        </main>

        <footer class="black-footer">
            <p class="footclass">© 2015 - 2026 Upwork® Global LLC • <a href="#">Privacy Policy</a> • <a href="#">Your
                    Privacy Choices</a></p>
        </footer>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
